<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenAI Chat</title>
<style>
  :root{
    --canvas:#EFEBE2;
    --canvas-2:#E4DFD2;
    --ink:#15150F;
    --accent:#FF4B2E;
    --moss:#2F3B2F;
    --taupe:#8C8672;
    --card:#FBFAF6;
    --line: rgba(21,21,15,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:'Instrument Sans', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @font-face{
    font-family:'Archivo Black';
    src:local('Archivo Black');
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:48px 24px 96px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:40px;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    font-family:'Archivo Black','Arial Black',sans-serif;
    font-size:clamp(28px,5vw,44px);
    letter-spacing:-0.02em;
    line-height:0.95;
    text-transform:uppercase;
  }
  .brand span{color:var(--accent);}
  .tagline{
    font-family:'IBM Plex Mono','Courier New',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--taupe);
    max-width:220px;
    text-align:right;
  }
  .section-label{
    font-family:'IBM Plex Mono','Courier New',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--moss);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .section-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .slots{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:44px;
  }
  @media (max-width:640px){
    .slots{grid-template-columns:1fr;}
    .brand{font-size:32px;}
    header{flex-direction:column;align-items:flex-start;}
    .tagline{text-align:left;}
  }
  .tag{
    position:relative;
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:6px 14px 6px 14px;
    aspect-ratio:3/4;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .tag:hover{
    transform:translateY(-3px);
    box-shadow:6px 8px 0 rgba(21,21,15,0.12);
  }
  .tag::before{
    content:'';
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:16px;
    height:16px;
    border:2px solid var(--ink);
    border-radius:50%;
    background:var(--canvas);
    z-index:2;
  }
  .tag .num{
    position:absolute;
    bottom:10px;
    left:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    background:var(--ink);
    color:var(--canvas);
    padding:2px 8px;
    border-radius:3px;
    z-index:2;
  }
  .tag .hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--taupe);
    text-align:center;
    padding:0 12px;
    margin-top:8px;
  }
  .tag .plus{
    font-size:34px;
    color:var(--taupe);
    margin-top:20px;
    line-height:1;
  }
  .tag img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .tag input[type=file]{display:none;}
  .tag .remove{
    position:absolute;
    top:8px;
    right:8px;
    z-index:3;
    background:var(--ink);
    color:var(--canvas);
    border:none;
    width:24px;
    height:24px;
    border-radius:50%;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .notes-block{
    margin-bottom:36px;
  }
  textarea{
    width:100%;
    min-height:96px;
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:6px 6px 6px 6px;
    padding:16px;
    font-family:'Instrument Sans','Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    resize:vertical;
  }
  textarea::placeholder{color:var(--taupe);}
  textarea:focus, .tag:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:2px;
  }
  .cta-row{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  button.generate{
    font-family:'Archivo Black','Arial Black',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
    font-size:16px;
    background:var(--ink);
    color:var(--canvas);
    border:2px solid var(--ink);
    border-radius:999px;
    padding:16px 32px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  button.generate:hover:not(:disabled){
    background:var(--accent);
    border-color:var(--accent);
    color:var(--ink);
  }
  button.generate:active:not(:disabled){transform:scale(0.98);}
  button.generate:disabled{
    opacity:0.45;
    cursor:not-allowed;
  }
  .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--taupe);
  }
  .error-box{
    margin-top:18px;
    border:2px solid var(--accent);
    background:#FFF3EF;
    color:var(--ink);
    padding:14px 16px;
    border-radius:6px;
    font-size:14px;
  }
  .result{
    margin-top:56px;
  }
  .receipt{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:4px;
    padding:32px 28px;
    position:relative;
  }
  .receipt::before{
    content:'';
    position:absolute;
    left:-2px; right:-2px; top:-2px;
    height:6px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 10px, transparent 10px 20px);
  }
  .receipt-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--taupe);
    margin-bottom:18px;
    padding-bottom:12px;
    border-bottom:1px dashed var(--line);
  }
  .receipt-body{
    font-size:16px;
    line-height:1.6;
    white-space:pre-wrap;
  }
  .receipt-actions{
    margin-top:22px;
    display:flex;
    gap:12px;
  }
  .icon-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    background:transparent;
    border:1.5px solid var(--ink);
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    color:var(--ink);
  }
  .icon-btn:hover{background:var(--ink);color:var(--canvas);}
  .placeholder-result{
    color:var(--taupe);
    font-size:14px;
    font-family:'IBM Plex Mono',monospace;
  }
  footer{
    margin-top:64px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--taupe);
    text-align:center;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">OpenAI Chat<span>.</span></div>
    <div class="tagline">OpenAI Chat</div>
  </header>

  <div class="section-label">02 — Adatok</div>
  <div class="notes-block">
    <textarea id="notes" placeholder="Kédezz tőlem"></textarea>
  </div>

  <div class="section-label">Küldés</div>
  <div class="cta-row">
    <button class="generate" id="genBtn">Generálás</button>
    <span class="status" id="statusText"></span>
  </div>
  <div id="errorSlot"></div>

  <div class="result">
    <div class="section-label">Eredmény</div>
    <div class="receipt">
      <div class="receipt-head">
        <span>listing_draft.txt</span>
        <span id="charCount">0 karakter</span>
      </div>
      <div class="receipt-body" id="resultBody">
        <span class="placeholder-result">Itt lesz a válasz.</span>
      </div>
    </div>
  </div>

</div>

<script>
  
const WORKER_URL = "https://fragrant-salad-2faf.just-my-games-gb.workers.dev";

const genBtn = document.getElementById('genBtn');
const statusText = document.getElementById('statusText');
const errorSlot = document.getElementById('errorSlot');
const resultBody = document.getElementById('resultBody');
const resultActions = document.getElementById('resultActions');
const charCount = document.getElementById('charCount');

function toBase64(dataUrl){
  return dataUrl.split(',')[1];
}

genBtn.addEventListener('click', async () => {

  let notes = document.getElementById('notes').value.trim();

  genBtn.disabled = true;
  statusText.textContent = 'Generálás folyamatban…';
  resultBody.innerHTML = '<span class="placeholder-result">Készül a válasz</span>';
  resultActions.style.display = 'none';

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes })
    });

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      const msg = data && data.error ? data.error : ('Szerverhiba: ' + response.status);
      throw new Error(msg);
    }

    const finalText = (data && data.description || '').trim();

    if (!finalText) {
      throw new Error('Üres válasz érkezett.');
    }

    resultBody.textContent = finalText;
    charCount.textContent = finalText.length + ' karakter';
    resultActions.style.display = 'flex';
    statusText.textContent = 'Kész.';
  } catch (err) {
    console.error(err);
    errorSlot.innerHTML = '<div class="error-box">Nem sikerült elkészíteni a választ. Próbáld újra. (' + (err.message || 'ismeretlen hiba') + ')</div>';
    resultBody.innerHTML = '<span class="placeholder-result">A generált válasz itt fog megjelenni.</span>';
    charCount.textContent = '0 karakter';
    statusText.textContent = '';
  } finally {
    genBtn.disabled = false;
  }
});


</script>
</body>
</html>
